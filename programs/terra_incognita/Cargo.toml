[package]
name = "terra-incognita"
version = "0.1.0"
description = "A global treasure hunt whose location lives inside a private ephemeral rollup"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "terra_incognita"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "=1.0.2", features = ["init-if-needed"] }
bytemuck = { version = "1.25", features = ["derive", "min_const_generics"] }
ephemeral-rollups-sdk = { version = "=0.17.3", features = ["anchor", "access-control", "vrf", "crank"] }
hydra-api = { version = "=0.2.1", features = ["cpi-native", "ephemeral"] }
solana-sha256-hasher = "3.1"

[target.'cfg(not(target_os = "solana"))'.dependencies]
solana-sha256-hasher = { version = "3.1", features = ["sha2"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
